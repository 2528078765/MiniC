[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minic"
version = "0.0.2"
description = "MiniC 本地优先 DeepAgent：RAG 知识库问答、文件/Git/命令工具与审批、会话与长期记忆、MCP/SKILL/子 Agent、崩溃恢复"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langgraph>=0.2.60",
    "langchain>=1.0.0",
    "langchain-core>=0.3.50",
    "langchain-deepseek>=0.1.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "chromadb>=1.0.0",
    "rank-bm25>=0.2.2",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "mcp>=1.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]

[project.scripts]
minic = "minic.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/minic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
